<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이연주 | 루멘스 프레임 (Lumens Frame)</title>
<meta name="description" content="루멘스 프레임 대표 이연주 — 브랜딩, 디자인, 영상">
<meta property="og:title" content="이연주 | 루멘스 프레임 (Lumens Frame)">
<meta property="og:description" content="브랜딩 · 디자인 · 영상">
<meta name="theme-color" content="#141B31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141B31; --navy-2:#1C2542; --gold:#C9A76A; --gold-deep:#A9854A;
    --paper:#F2ECE3; --sub:#3A4258;
    --font:'Roboto','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
    --font-kr:'Noto Sans KR','Roboto',-apple-system,'Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--navy);color:var(--paper);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));display:flex;justify-content:center}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:28px}

  /* 카드 (뒤집기) */
  .card-wrap{perspective:1400px}
  .card{position:relative;width:100%;aspect-ratio:90/50;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1);cursor:pointer;border:0;padding:0;background:none;display:block;font:inherit;color:inherit;text-align:left}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;container-type:inline-size;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  /* 카드 안 요소는 카드 폭 기준(340단위)으로 비례 */
  .face .in{--u:calc(100cqw / 340);position:absolute;inset:0}
  .face .in *{--u:calc(100cqw / 340)}

  .front{background:var(--navy-2);color:var(--gold)}
  .front .in{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*11)}
  .front .name{font-size:calc(var(--u)*19);font-weight:300;letter-spacing:.34em;padding-left:.34em}
  .front .rule{width:calc(var(--u)*28);height:1px;background:var(--gold);opacity:.7}
  .front .tag{font-size:calc(var(--u)*7);letter-spacing:.32em;padding-left:.32em}

  .back{transform:rotateY(180deg);background:var(--paper);color:var(--navy)}
  .back .in{padding:calc(var(--u)*28) calc(var(--u)*26) calc(var(--u)*22);display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-kr)}
  .back .brand{font-family:var(--font);font-size:calc(var(--u)*12.5);font-weight:400;letter-spacing:.28em}
  .back .brand-sub{font-size:calc(var(--u)*6.8);font-weight:500;letter-spacing:.12em;color:var(--sub);margin-top:calc(var(--u)*6)}
  .back .row{display:flex;justify-content:space-between;align-items:flex-end}
  .back .who{display:flex;flex-direction:column;gap:calc(var(--u)*14);padding-bottom:calc(var(--u)*2)}
  .back .rule{width:calc(var(--u)*26);height:1px;background:var(--gold-deep)}
  .back .person{font-size:calc(var(--u)*13);font-weight:500;letter-spacing:.12em}
  .back .person small{font-size:calc(var(--u)*6.8);font-weight:500;color:var(--sub);margin-right:calc(var(--u)*7);letter-spacing:.1em}
  .back .info{display:flex;gap:calc(var(--u)*14)}
  .back .vr{width:1px;background:var(--gold-deep)}
  .back ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*6);font-family:var(--font);font-size:calc(var(--u)*7.2);letter-spacing:.04em}
  .back li{display:flex;align-items:center;gap:calc(var(--u)*8)}
  .back li svg{width:calc(var(--u)*9);height:calc(var(--u)*9);flex:none}
  .back .motto{align-self:flex-end;font-size:calc(var(--u)*6.2);letter-spacing:.24em;color:var(--gold-deep)}

  .hint{margin:-14px 0 0;text-align:center;font-size:12px;color:#8E95AB;font-family:var(--font-kr)}

  /* 소개 */
  .intro h1{margin:0;font-family:var(--font-kr);font-size:24px;font-weight:500;letter-spacing:.04em}
  .intro h1 span{font-family:'Roboto',sans-serif;font-weight:300;color:var(--gold);margin-left:10px;font-size:16px;letter-spacing:.08em}
  .intro p{margin:10px 0 0;color:#C4C8D4;font-family:var(--font-kr);font-size:14px;line-height:1.7}

  /* 버튼 */
  .actions{display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;gap:16px;min-height:60px;padding:0 20px;border-radius:6px;text-decoration:none;font-family:var(--font-kr);font-size:15px;color:var(--paper);background:rgba(255,255,255,.04);border:1px solid rgba(201,167,106,.35);cursor:pointer;width:100%;text-align:left}
  .btn svg{width:20px;height:20px;flex:none;color:var(--gold)}
  .btn .txt{display:flex;flex-direction:column;gap:3px}
  .btn .txt small{font-family:'Roboto',sans-serif;font-size:12.5px;color:#9AA1B6}
  .btn.primary{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:500}
  .btn.primary svg{color:var(--navy)}
  .btn:focus-visible,.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  footer{text-align:center;font-size:12px;color:#6E7690;letter-spacing:.12em;margin-top:4px}

  @media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>lumensframe.co.kr</li>
