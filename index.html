<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --accent: #A08676;
    --ink: #111111;
    --wordmark: #565656;
    --sub: #4A3F3A;
    --rule: #A69C95;
    --cream: #FAF7F4;
    --scale: 2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ECE8E4;
    font-family: Roboto, Pretendard, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 16px 64px;
  }
  h1 {
    font-family: Roboto, Pretendard, sans-serif;
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 0.14em;
    color: var(--wordmark);
    margin: 0 0 6px;
    text-align: center;
  }
  .hint { text-align: center; font-size: 13px; color: #767676; margin: 0 0 40px; }
  .cards {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  figcaption { font-size: 12px; color: #767676; letter-spacing: 0.04em; }

  /* 화면용 확대: 카드 원본은 340×189px(= 90×50mm) */
  .frame {
    width: calc(340px * var(--scale));
    height: calc(189px * var(--scale));
    max-width: 100%;
    aspect-ratio: 340 / 189;
    position: relative;
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.10);
    container-type: inline-size;
  }
  .card {
    width: 340px;
    height: 189px;
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    transform: scale(calc(100cqw / 340px));
  }
  @supports not (width: 1cqw) {
    .card { transform: scale(var(--scale)); }
  }

  /* 앞면 로고 */
  .front {
    background: #FFFFFF;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-top: 4px;
  }
  .mono {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 9px;
  }
  .mono span {
    font-family: 'Pinyon Script', cursive;
    font-size: 12px; line-height: 1; color: #fff;
    letter-spacing: -0.12em; padding-right: 0.12em; margin-top: 1px;
  }
  .front .lumens { font-size: 24px; letter-spacing: .2em; padding-left: .2em; line-height: 1; color: var(--wordmark); }
  .front .frame-word { font-size: 9.5px; letter-spacing: .2em; padding-left: .2em; line-height: 1; margin-top: 5px; }
  .front .services { font-size: 6px; font-weight: 500; letter-spacing: .3em; padding-left: .3em; margin-top: 13px; color: #1A1A1A; }
  .front .tagline { font-size: 8px; font-weight: 300; line-height: 1.3; text-align: center; margin-top: 5px; color: #1A1A1A; }

  /* 뒷면 */
  .back {
    background: var(--cream);
    display: flex; align-items: center;
    padding: 0 30px 16px 40px; gap: 22px;
  }
  .back.en { padding-right: 26px; gap: 20px; }
  .left { display: flex; flex-direction: column; width: 98px; padding-top: 2px; }
  .wordmark { font-size: 20px; letter-spacing: .14em; line-height: 1.02; color: var(--wordmark); }
  .kname { font-family: Pretendard, sans-serif; font-size: 8.5px; font-weight: 600; color: var(--sub); margin-top: 7px; letter-spacing: .02em; }
  .short-rule { width: 23px; height: 1px; background: var(--accent); margin-top: 16px; }
  .kservices { font-family: Pretendard, sans-serif; font-size: 8px; font-weight: 600; color: var(--sub); margin-top: 18px; word-spacing: .25em; white-space: nowrap; }
  .eservices { font-size: 6.5px; font-weight: 500; color: var(--sub); margin-top: 16px; letter-spacing: .16em; line-height: 1.6; }
  .divider { width: 1px; height: 82px; background: var(--rule); }
  .right { display: flex; flex-direction: column; }
  .name-row { display: flex; align-items: baseline; gap: 12px; }
  .back.en .name-row { gap: 10px; }
  .role-ko { font-family: Pretendard, sans-serif; font-size: 7px; font-weight: 600; letter-spacing: .3em; }
  .name-ko { font-family: Pretendard, sans-serif; font-size: 15px; font-weight: 400; letter-spacing: .38em; }
  .role-en { font-size: 6.5px; font-weight: 500; letter-spacing: .2em; }
  .name-en { font-size: 14px; letter-spacing: .12em; }
  .contacts { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; font-size: 8px; }
  .contacts div { display: flex; align-items: center; gap: 9px; }
  .contacts a { color: inherit; text-decoration: none; }
  .qr { position: absolute; right: 16px; bottom: 14px; width: 26px; height: 26px; line-height: 0; }
  .contacts svg { width: 10px; height: 10px; flex: none; }

  /* 인쇄: 카드 한 장 = 90×50mm 한 페이지 */
  @page { size: 90mm 50mm; margin: 0; }
  @media print {
    body { background: none; }
    .page { padding: 0; max-width: none; }
    h1, .hint, figcaption { display: none; }
    .cards { gap: 0; display: block; }
    figure { display: block; break-after: page; page-break-after: always; }
    .frame { width: 90mm; height: 50mm; max-width: none; border-radius: 0; box-shadow: none; }
    .card { transform: scale(calc(90mm / 340px)); }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
